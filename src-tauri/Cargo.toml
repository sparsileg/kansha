[package]
name = "kansha"
description = "Kansha desktop shell (Tauri commands only; no business logic)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# Required so `cargo run` and the Android/iOS shells share one entry point.
name = "kansha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kansha-core = { path = "../crates/kansha-core", features = ["specta"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Folder and file pickers for the backup folder and restore (BAK-030,
# BAK-070); used from Rust only, so the webview gets no dialog permission.
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json = "1"
specta.workspace = true
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror.workspace = true
# Price download (PRC-040, D-40): blocking HTTPS, rustls; pinned for
# MSRV 1.85 when chosen. The core parses the reply; only this shell
# touches the network (SECU-070).
ureq = "=2.12.1"
# `kansha add` asks field by field with Tab completion (CLI-030); no
# default features, so no history file: no entry is ever written to one.
rustyline = { version = "=18.0.1", default-features = false, features = ["custom-bindings"] }
# Watches the open book's inbox so entries from the command line show
# without a click in the window (CLI-040). Book folders are on a fixed
# drive, where file events are reliable.
notify = "=8.2.0"

# Saving PDFs with the orientation set in code (RPT-050); the same
# versions Tauri's wry already uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

# Saving PDFs on Windows (RPT-050) through WebView2's PrintToPdf; pinned
# to the versions Tauri's wry already uses.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
