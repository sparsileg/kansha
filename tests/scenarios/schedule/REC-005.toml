id = "REC-005"
description = "Weekend shifting moves due dates, not the series; the entry uses the shifted date"
requirements = ["REC-050"]
as_of = "2026-07-01"

[[accounts]]
name = "Checking"
type = "checking"
opening_balance = "5000.00"
opening_date = "2026-01-01"

[[accounts]]
name = "Savings"
type = "savings"

[[categories]]
path = "Bills"
kind = "expense"

# 2026-08-01 is a Saturday and 2026-11-01 a Sunday.
[[actions]]
type = "schedule"
ref = "prev"
account = "Checking"
amount = "-10.00"
category = "Bills"
frequency = "monthly"
day1 = 1
start = "2026-08-01"
weekend_rule = "previous"

[[actions]]
type = "schedule"
ref = "next"
account = "Checking"
amount = "-10.00"
category = "Bills"
frequency = "monthly"
day1 = 1
start = "2026-08-01"
weekend_rule = "next"

# `prev_b` is never entered, so its whole series is still pending.
[[actions]]
type = "schedule"
ref = "prev_b"
account = "Checking"
amount = "-10.00"
category = "Bills"
frequency = "monthly"
day1 = 1
start = "2026-08-01"
weekend_rule = "previous"

[[expect.occurrences]]
ref = "prev_b"
from = "2026-07-01"
to = "2026-11-30"
dates = ["2026-07-31", "2026-09-01", "2026-10-01", "2026-10-30"]

# Expectations are checked after all actions: August of `prev` is entered.
[[expect.occurrences]]
ref = "prev"
from = "2026-07-01"
to = "2026-11-30"
dates = ["2026-09-01", "2026-10-01", "2026-10-30"]

[[expect.occurrences]]
ref = "next"
from = "2026-07-01"
to = "2026-11-30"
dates = ["2026-08-03", "2026-09-01", "2026-10-01", "2026-11-02"]

[[actions]]
type = "enter_occurrence"
ref = "prev"
due = "2026-08-01"
txn_ref = "aug"

[[expect.schedules]]
ref = "prev"
next_due = "2026-09-01"

[[expect.register]]
account = "Checking"
rows = [
    { date = "2026-01-01", amount = "5000.00", balance = "5000.00" },
    { date = "2026-07-31", amount = "-10.00", balance = "4990.00", ref = "aug", counterpart = "Bills" },
]
