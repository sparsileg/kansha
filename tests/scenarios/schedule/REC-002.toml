id = "REC-002"
description = "Leap years: Feb 29 exists in 2028 only; yearly Feb 29 falls back to Feb 28"
requirements = ["REC-020", "REC-040"]
as_of = "2024-01-01"

[[accounts]]
name = "Checking"
type = "checking"
opening_balance = "5000.00"
opening_date = "2026-01-01"

[[accounts]]
name = "Savings"
type = "savings"

[[categories]]
path = "Bills"
kind = "expense"

[[actions]]
type = "schedule"
ref = "m29"
account = "Checking"
amount = "-10.00"
category = "Bills"
frequency = "monthly"
day1 = 29
start = "2027-12-29"

[[actions]]
type = "schedule"
ref = "yearly"
account = "Checking"
amount = "-10.00"
category = "Bills"
frequency = "yearly"
