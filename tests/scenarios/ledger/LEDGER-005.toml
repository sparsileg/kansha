id = "LEDGER-005"
description = "Void zeroes the amounts but keeps the transaction in the register; a void can't be edited"
requirements = ["TXN-040"]
as_of = "2026-06-30"

[[accounts]]
name = "Checking"
type = "checking"
opening_balance = "1000.00"
opening_date = "2026-01-01"

[[categories]]
path = "Rent"
kind = "expense"

[[actions]]
type = "entry"
ref = "rent"
date = "2026-02-01"
account = "Checking"
payee = "Landlord"
check_num = "1002"
amount = "-1200.00"
category = "Rent"

[[actions]]
type = "void"
ref = "rent"

[[actions]]
type = "void"
ref = "rent"
expect_error = "already void"

[[actions]]
type = "edit"
ref = "rent"
date = "2026-02-01"
account = "Checking"
amount = "-1200.00"
category = "Rent"
expect_error = "voided transaction cannot be edited"

[expect.balances]
"Checking" = "1000.00"

[expect.category_totals]
"Rent" = "0.00"

[[expect.register]]
account = "Checking"
rows = [
    { date = "2026-01-01", amount = "1000.00", balance = "1000.00" },
    { date = "2026-02-01", amount = "0.00", balance = "1000.00", ref = "rent", status = "void", payee = "Landlord", check_num = "1002", counterpart = "Rent" },
]
