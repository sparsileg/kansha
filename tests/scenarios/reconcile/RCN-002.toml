id = "RCN-002"
description = "A session in progress keeps its check marks (save and resume); its statement can be corrected; items can be unchecked"
requirements = ["RCN-050", "RCN-020"]
as_of = "2026-03-15"

[[accounts]]
name = "Checking"
type = "checking"

[[categories]]
path = "Food:Groceries"
kind = "expense"

[[categories]]
path = "Salary"
kind = "income"

[[actions]]
type = "entry"
ref = "open"
date = "2026-01-01"
account = "Checking"
amount = "1000.00"
category = "Salary"

[[actions]]
type = "entry"
ref = "groceries"
date = "2026-01-05"
account = "Checking"
amount = "-100.00"
payee = "Costco"
category = "Food:Groceries"

[[actions]]
type = "entry"
ref = "pay"
date = "2026-01-10"
account = "Checking"
amount = "500.00"
