[[expect.register]]
account = "Checking"
rows = [
    { date = "2026-01-01", amount = "1000.00", balance = "1000.00", cleared = "cleared" },
    { date = "2026-01-05", amount = "-100.00", balance = "900.00", cleared = "unmarked" },
    { date = "2026-01-10", amount = "500.00", balance = "1400.00", cleared = "unmarked" },
]
