id = "RCN-001"
description = "Reconcile a checking account: items after the statement date are left out, Finish needs a zero difference"
requirements = ["RCN-010", "RCN-020"]
as_of = "2026-03-15"

[[accounts]]
name = "Checking"
type = "checking"

[[categories]]
path = "Food:Groceries"
kind = "expense"

[[categories]]
path = "Salary"
kind = "income"

[[actions]]
type = "entry"
ref = "open"
date = "2026-01-01"
account = "Checking"
amount = "1000.00"
category = "Salary"

[[actions]]
type = "entry"
ref = "groceries"
date = "2026-01-05"
account = "Checking"
amount = "-100.00"
payee = "Costco"
category = "Food:Groceries"

[[actions]]
type = "entry"
ref = "pay"
date = "2026-01-10"
account = "Checking"
amount = "500.00"
payee = "Employer"
category = "Salary"

[[actions]]
type = "entry"
ref = "late"
date = "2026-02-05"
account = "Checking"
amount = "-50.00"
category = "Food:Groceries"

[[actions]]
type = "reconcile_start"
account = "Checking"
statement_date = "2026-01-31"
statement_balance = "1400.00"

[[actions]]
type = "reconcile_check"
account = "Checking"
refs = ["late"]
expect_error = "after the statement date"

[[actions]]
type = "reconcile_check"
account = "Checking"
refs = ["open", "groceries"]

[[actions]]
type = "reconcile_finish"
account = "Checking"
expect_error = "the difference is 500.00"

[[actions]]
type = "reconcile_check"
account = "Checking"
refs = ["pay"]

[[actions]]
type = "reconcile_finish"
account = "Checking"

[expect.cleared_balances]
"Checking" = "1400.00"

[[expect.reconcile_history]]
account = "Checking"
rows = [
    { statement_date = "2026-01-31", statement_balance = "1400.00", opening_balance = "0.00", status = "finished", items = 3, total = "1400.00" },
]

[[expect.register]]
account = "Checking"
rows = [
    { date = "2026-01-01", amount = "1000.00", balance = "1000.00", ref = "open", cleared = "reconciled" },
    { date = "2026-01-05", amount = "-100.00", balance = "900.00", ref = "groceries", cleared = "reconciled" },
    { date = "2026-01-10", amount = "500.00", balance = "1400.00", ref = "pay", cleared = "reconciled" },
    { date = "2026-02-05", amount = "-50.00", balance = "1350.00", ref = "late", cleared = "unmarked" },
]
