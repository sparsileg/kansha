[[expect.reconcile_history]]
account = "Checking"
rows = [
    { statement_date = "2026-01-31", statement_balance = "900.00", opening_balance = "0.00", status = "in_progress", items = 0 },
    { statement_date = "2026-01-31", statement_balance = "900.00", opening_balance = "0.00", status = "abandoned", items = 0 },
]
