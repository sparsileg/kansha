[workspace]
resolver = "3"
members = ["crates/kansha-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
proptest = "1"
rust_decimal = "1"
# SQLCipher build with its own OpenSSL, so Kubuntu, Windows, and CI need no
# system crypto library (D-20, D-110). Unkeyed databases behave as plain SQLite.
rusqlite = { version = "0.40", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "cache"] }
serde = { version = "1", features = ["derive"] }
# Optional in kansha-core (feature `specta`); pinned exactly (D-120, DR-03).
specta = { version = "=2.0.0-rc.25", features = ["derive", "std"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
