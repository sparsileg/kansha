[workspace]
resolver = "3"
members = ["crates/kansha-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
proptest = "1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
