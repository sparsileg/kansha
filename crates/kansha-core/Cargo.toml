[package]
name = "kansha-core"
description = "Kansha accounting engine (no Tauri dependency)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono.workspace = true
rusqlite.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta = { workspace = true, optional = true }
age = { version = "=0.12.1", features = ["armor"] }
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2"] }
getrandom = "=0.2.17"
flate2 = "=1.1.10"
# SHA-256 of import files (MIG-170); already built for `age`.
sha2 = "=0.10.9"

[features]
# Derive `specta::Type` on the types that cross IPC (D-120). Enabled by
# src-tauri; the crate itself has no Tauri dependency.
specta = ["dep:specta"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
